<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#0A0A0F"/>
  <!-- Brain shape -->
  <g transform="translate(50,50)" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere -->
    <path d="M-2,-22 C-2,-22 -18,-22 -24,-12 C-30,-2 -28,8 -22,14 C-18,18 -18,22 -14,24 C-10,26 -4,24 -2,22"/>
    <!-- Right hemisphere -->
    <path d="M2,-22 C2,-22 18,-22 24,-12 C30,-2 28,8 22,14 C18,18 18,22 14,24 C10,26 4,24 2,22"/>
    <!-- Center line -->
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <!-- Left bumps -->
    <path d="M-24,-6 C-30,-6 -32,2 -26,4"/>
    <path d="M-22,10 C-28,12 -28,20 -20,20"/>
    <!-- Right bumps -->
    <path d="M24,-6 C30,-6 32,2 26,4"/>
    <path d="M22,10 C28,12 28,20 20,20"/>
    <!-- Code symbol </> -->
    <text x="0" y="6" font-size="18" font-family="monospace" font-weight="bold" fill="#8B5CF6" stroke="none" text-anchor="middle"></text>
  </g>
  <!-- </> text centered -->
  <text x="50" y="57" font-size="20" font-family="'Courier New', monospace" font-weight="900" fill="#8B5CF6" text-anchor="middle">&lt;/&gt;</text>
</svg>
